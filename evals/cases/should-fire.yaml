# Should-fire corpus: one workflow per case.
#
# Written against the SKILL.md bodies and deliberately NOT against the
# frontmatter descriptions. The routing benchmark's prompts were written
# against those descriptions, which is why it cannot see a workflow that
# never fires on natural phrasing; repeating that here would reproduce the
# blind spot in the corpus meant to close it.
#
# Every prompt was reviewed a second time for description vocabulary, for
# reading like specification prose, and for a label a cold reader would
# disagree with.

version: 1
suite: should-fire
cases:
  - id: audit-capabilities-checklist-from-memory
    prompt: "third time this quarter i've typed out the same seven line checklist into chat from memory, half the team does it slightly differently and one of them swears he wrote it down somewhere"
    lang: en
    expect:
      - audit-capabilities
    forbid: []
    fixture: bare
    quick: false
    why: "Describes a repeated procedure and its scattered prior art as a complaint, naming no action at all, which is how recurrence is usually reported out loud."
  - id: audit-capabilities-eight-things-in-folder
    prompt: "we've got eight of these little how-to files in the repo now and come release day i honestly can't tell which one i'm supposed to follow, two of them talk about the changelog. i was about to write another one for the migration dance but i bet that's already sitting in one of them"
    lang: en
    expect:
      - audit-capabilities
    forbid:
      - verify-installation
    fixture: webshop
    quick: false
    why: "Overlap and duplication surface as everyday confusion about which of several similar things to use, and the mention of an installed folder is the near-miss that could pull the installation checker instead."
  - id: audit-capabilities-es-comandos-solapados
    prompt: "cada uno del equipo hace el despliegue a su manera y ya tenemos tres carpetas de comandos que se pisan entre ellas, antes de escribir otra más quiero saber qué de eso ya está cubierto y qué sobra"
    lang: es
    expect:
      - audit-capabilities
    forbid: []
    fixture: pylib
    quick: false
    why: "Natural Spanish for a team whose tooling has fragmented, asking both what is covered and what is redundant, which is the removal half of the audit that English cases rarely reach."
  - id: audit-capabilities-same-four-steps
    prompt: "same four steps every time i add a new item type here and i've done it three times this month, is there already something set up for that or am i about to write the same thing twice"
    lang: en
    expect:
      - audit-capabilities
    forbid: []
    fixture: pylib
    quick: true
    why: "A developer notices a procedure recurring and asks whether existing coverage exists before adding more, which is the real trigger, phrased as a hunch rather than as a gap analysis request."
  - id: communicate-efficiently-es-ticket-cuatro-lineas
