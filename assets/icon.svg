<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Powers icon</title>
  <desc id="desc">A luminous cognitive core surrounded by focused reasoning paths.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151B3D"/>
      <stop offset="1" stop-color="#080B19"/>
    </linearGradient>
    <linearGradient id="power" x1="118" y1="102" x2="397" y2="406" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CFF"/>
      <stop offset="0.48" stop-color="#5C6CFF"/>
      <stop offset="1" stop-color="#24DDF5"/>
    </linearGradient>
    <linearGradient id="core" x1="211" y1="205" x2="306" y2="309" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#8EF5FF"/>
      <stop offset="1" stop-color="#646BFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bg)"/>
  <rect x="19" y="19" width="474" height="474" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
  <path d="M369 111A178 178 0 1 0 369 401" fill="none" stroke="url(#power)" stroke-width="46" stroke-linecap="round"/>
  <path d="M330 169A112 112 0 1 0 330 343" fill="none" stroke="#9AA7FF" stroke-opacity=".92" stroke-width="30" stroke-linecap="round"/>
  <path d="M371 174l31-31m-31 195 31 31" fill="none" stroke="#26DDF5" stroke-width="18" stroke-linecap="round"/>
  <circle cx="402" cy="143" r="13" fill="#8B5CFF"/>
  <circle cx="402" cy="369" r="13" fill="#24DDF5"/>
  <path d="M256 202l54 54-54 54-54-54 54-54z" fill="url(#core)" filter="url(#glow)"/>
  <path d="M256 219l37 37-37 37-37-37 37-37z" fill="#E9FDFF" fill-opacity=".23"/>
  <circle cx="256" cy="256" r="10" fill="#FFFFFF"/>
</svg>
