<!doctype html><html><head><meta charset="utf-8"><title>Release Queue</title></head>
<body><main><h1>Release Queue</h1>
<label>Search tickets <input id="search" aria-label="Search tickets"></label>
<button id="ticket" hidden>QCU-217</button>
<section id="details" hidden><h2>QCU-217</h2>
<label>Assignee <input id="assignee" aria-label="Assignee"></label>
<label>Priority <select id="priority" aria-label="Priority"><option>Normal</option><option>High</option></select></label>
<label>Release note <input id="note" aria-label="Release note"></label>
<button id="save">Save details</button><button id="ready" disabled>Mark ready</button>
<p>Status: <strong id="status">Draft</strong></p></section></main>
<script>
const post = async (url, data={}) => { const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error((await r.json()).error); return r.json(); };
const load = async () => { const s=await (await fetch('/api/state')).json(); ticket.hidden=!s.events.includes('search:QCU-217'); details.hidden=!s.selected; assignee.value=s.assignee; priority.value=s.priority; note.value=s.note; document.getElementById('status').textContent=s.status; ready.disabled=s.events.at(-1)!=='save'; };
search.addEventListener('keydown', async e => { if(e.key==='Enter'){ await post('/api/search',{query:search.value}); await load(); } });
ticket.onclick=async()=>{await post('/api/select');await load();};
save.onclick=async()=>{await post('/api/save',{assignee:assignee.value,priority:priority.value,note:note.value});await load();};
ready.onclick=async()=>{await post('/api/ready');await load();};
load();
</script></body></html>
