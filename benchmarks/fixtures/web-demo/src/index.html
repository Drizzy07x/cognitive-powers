<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Browser evidence fixture</title>
  </head>
  <body>
    <main>
      <h1>Retry control</h1>
      <p id="status" role="status" aria-live="polite">Attempts: 0</p>
      <button id="retry" type="button">Retry payment</button>
    </main>
    <script>
      let attempts = 0;
      const status = document.querySelector('#status');
      document.querySelector('#retry').addEventListener('click', () => {
        attempts += 1;
        status.textContent = `Attempts: ${attempts}`;
      });
    </script>
  </body>
</html>
