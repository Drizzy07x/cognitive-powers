# The lowest interpreter the validation matrix declares. Ruff parses against
# this floor, so syntax that only a newer interpreter accepts is reported here
# instead of at import time on the oldest matrix cell. Keep it equal to the
# lowest entry of the python axis in .github/workflows/validate.yml;
# test_plugin_contract asserts the two agree.
target-version = "py311"

# The formatter's output is version-sensitive, and `ruff format --check` is a
# gate command. requirements-dev.txt hash-pins the version, but nothing made the
# ruff that actually runs be that one: an interpreter with a different ruff on it
# reformats files this pin would leave alone, so the gate passes locally and
# fails in CI, or the reverse. Ruff refuses to start on a mismatch instead.
# Bumping requirements-dev.in without bumping this is caught by
# test_plugin_contract, because two spellings of one pin is how a pin stops
# pinning.
required-version = "==0.16.1"

# The enforced set, stated rather than inherited. Ruff 0.16 widened its default
# selection from these four families to roughly fifteen -- isort, pyupgrade,
# simplify, refurb, flake8-bugbear and more -- which turned a version bump into
# 246 findings across four directories without a line of this repository
# changing. A gate whose meaning moves when a dependency releases is the defect
# this project keeps writing tests against, so the selection is pinned here and
# widening it is now a commit someone makes on purpose.
[lint]
select = ["E4", "E7", "E9", "F"]
