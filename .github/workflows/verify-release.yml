name: Verify published release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable version tag to verify
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  verify-published-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Download immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --dir release-download
      - name: Rebuild and compare published canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(find release-download -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(cognitive-powers-1.6.0.tar cognitive-powers-1.6.0.tar.sha256 cognitive-powers-release-witness.json compatibility-matrix.json compatibility.md release-manifest.json reproducibility-report.json)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${expected[*]}"
          python scripts/build_release_manifest.py --tag "${{ inputs.tag }}" --archive reproduced.tar --output reproduced-manifest.json
          cmp reproduced.tar release-download/cognitive-powers-1.6.0.tar
          cmp reproduced-manifest.json release-download/release-manifest.json
          (cd release-download && sha256sum --check -- ./cognitive-powers-1.6.0.tar.sha256)
          python - <<'PY'
          import json, pathlib
          matrix=json.loads(pathlib.Path('release-download/compatibility-matrix.json').read_text(encoding='utf-8'))
          assert len(matrix['rows']) == 108
          assert all(row['status'] == 'compatible' for row in matrix['rows'])
          PY
          python scripts/validate_compatibility_matrix.py --matrix release-download/compatibility-matrix.json --contract compatibility-contract.json
      - name: Verify GitHub build provenance for the published archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify release-download/cognitive-powers-1.6.0.tar --repo "${{ github.repository }}"
