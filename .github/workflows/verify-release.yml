name: Verify published release

"on":
  # `release` covers a human-created release. It cannot cover this project's
  # own publisher: a release created with GITHUB_TOKEN raises no event, so
  # publish-release.yml dispatches this workflow explicitly as its last step.
  release:
    types: [published]
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable version tag to verify
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  verify-published-assets:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.subject.outputs.tag }}
    steps:
      - name: Resolve the tag under verification
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            # Scheduled sweep: verify the latest published release.
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          if [ -z "$tag" ]; then
            echo "no published release to verify" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.subject.outputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Download immutable GitHub Release assets
        # Outside the checkout: ./assets is tracked artwork, and downloading
        # into the working tree is the publisher defect this job must not copy.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${{ steps.subject.outputs.tag }}"
          --repo "${{ github.repository }}"
          --dir "${{ runner.temp }}/release-download"
      - name: Rebuild and compare published canonical bytes
        shell: bash
        env:
          TAG: ${{ steps.subject.outputs.tag }}
          DOWNLOAD: ${{ runner.temp }}/release-download
          REBUILD: ${{ runner.temp }}/release-rebuild
        run: |
          set -euo pipefail
          # The archive is named after the release it carries. Deriving that name
          # from the tag under verification keeps this gate usable for every
          # release instead of only the one it was written for.
          archive="cognitive-powers-${TAG#v}.tar"
          mapfile -t actual < <(find "$DOWNLOAD" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=("$archive" "$archive.sha256" cognitive-powers-release-witness.json compatibility-matrix.json compatibility.md release-manifest.json reproducibility-report.json)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${actual[*]}" != "${expected[*]}" ]; then
            echo "published asset set does not match the allowlist" >&2
            printf 'actual:   %s\n' "${actual[@]:-<none>}" >&2
            printf 'expected: %s\n' "${expected[@]}" >&2
            exit 1
          fi
          mkdir -p "$REBUILD"
          python scripts/build_release_manifest.py --tag "$TAG" --archive "$REBUILD/reproduced.tar" --output "$REBUILD/reproduced-manifest.json"
          if ! cmp "$REBUILD/reproduced.tar" "$DOWNLOAD/$archive"; then
            echo "published archive does not reproduce from the tagged source" >&2
            ls -l "$REBUILD/reproduced.tar" "$DOWNLOAD/$archive" >&2
            exit 1
          fi
          if ! cmp "$REBUILD/reproduced-manifest.json" "$DOWNLOAD/release-manifest.json"; then
            echo "published manifest does not reproduce from the tagged source" >&2
            diff <(python -m json.tool "$REBUILD/reproduced-manifest.json") <(python -m json.tool "$DOWNLOAD/release-manifest.json") >&2 || true
            exit 1
          fi
          (cd "$DOWNLOAD" && sha256sum --check -- "./$archive.sha256")
          commit=$(git rev-parse HEAD)
          python - "$TAG" "$commit" "$archive" "$DOWNLOAD" <<'PY'
          import json, pathlib, sys
          tag, commit, archive = sys.argv[1], sys.argv[2], sys.argv[3]
          download = pathlib.Path(sys.argv[4])
          manifest = json.loads((download / 'release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['tag'] == tag, f"manifest tag {manifest['tag']!r} != {tag!r}"
          assert manifest['commit'] == commit, f"manifest commit {manifest['commit']!r} != {commit!r}"
          assert manifest['version'] == tag[1:], f"manifest version {manifest['version']!r} != {tag[1:]!r}"
          checksum = (download / (archive + '.sha256')).read_text(encoding='ascii').split()[0]
          assert manifest['archive']['sha256'] == checksum, 'manifest archive digest != published checksum'
          report = json.loads((download / 'reproducibility-report.json').read_text(encoding='utf-8'))
          assert report['version'] == manifest['version'], f"report version {report['version']!r} diverges"
          assert report['archive'] == archive, f"report archive {report['archive']!r} != {archive!r}"
          witness = json.loads((download / 'cognitive-powers-release-witness.json').read_text(encoding='utf-8'))
          assert witness.get('releaseReady') is True, 'witness does not declare the release ready'
          matrix = json.loads((download / 'compatibility-matrix.json').read_text(encoding='utf-8'))
          assert len(matrix['rows']) == 108, f"matrix rows {len(matrix['rows'])} != 108"
          summary = matrix['summary']
          assert summary == {'compatible': 108, 'incompatible': 0, 'unknown': 0}, f"matrix summary {summary}"
          PY
          python scripts/validate_compatibility_matrix.py --matrix "$DOWNLOAD/compatibility-matrix.json" --contract compatibility-contract.json
      - name: Verify the release body is the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.subject.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "${{ runner.temp }}/published-body.md"
          python scripts/release_identity.py --version "${TAG#v}" --output "${{ runner.temp }}/expected-notes.md"
          python - "${{ runner.temp }}/published-body.md" "${{ runner.temp }}/expected-notes.md" <<'PY'
          import pathlib, sys
          published = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').replace('\r\n', '\n').strip()
          expected = pathlib.Path(sys.argv[2]).read_text(encoding='utf-8').strip()
          if published != expected:
              sys.stderr.write('published release body is not the changelog section\n')
              sys.stderr.write(f'published: {len(published)} chars; expected: {len(expected)} chars\n')
              raise SystemExit(1)
          PY
      - name: Verify GitHub build provenance for the published archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.subject.outputs.tag }}
        run: gh attestation verify "${{ runner.temp }}/release-download/cognitive-powers-${TAG#v}.tar" --repo "${{ github.repository }}"

  record-published-release:
    # The one checklist step no gate could ever watch, because it ran after
    # every gate had finished on a release that was already out. It failed the
    # way that shape of step always eventually fails: a release was published
    # and never entered docs/releases.json, so the documented rollback target
    # would have sent a reader recovering from a bad release past the release
    # in between it. The changelog names which one; this file must carry no
    # release literal, because a gate pinned to a version is not a gate.
    #
    # Recording it here binds the entry to the verification that just
    # reproduced the archive from the tagged source and checked its
    # provenance, so the record cannot exist without the evidence for it. It
    # runs after that job and only when it succeeded: a release this workflow
    # could not verify is one docs/releases.json must keep refusing to claim.
    needs: verify-published-assets
    if: needs.verify-published-assets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Record the verified tag as published
        env:
          TAG: ${{ needs.verify-published-assets.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$TAG" <<'PY'
          import json, pathlib, sys

          tag = sys.argv[1]
          # A prerelease is verified like any other tag and recorded like none
          # of them. This file is read for one thing -- the rollback target a
          # reader escaping a bad release is sent to -- and sending them to a
          # release candidate is not a recovery. It also has no place in the
          # ordering below, which ranks dotted integers and would raise on the
          # suffix rather than misplace it.
          if "-" in tag:
              raise SystemExit(0)
          path = pathlib.Path("docs/releases.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          published = payload["published"]
          if tag in published:
              raise SystemExit(0)
          # Newest first, ordered by version rather than by arrival: a
          # re-verification of an older release must not claim to be the
          # newest, and the rollback target is read off the front of this list.
          def key(entry: str) -> tuple[int, ...]:
              return tuple(int(part) for part in entry[1:].split("."))

          published.append(tag)
          published.sort(key=key, reverse=True)
          path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          if git diff --quiet -- docs/releases.json; then
            echo "docs/releases.json already records $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/releases.json
          git commit -m "chore: record $TAG as published"
          # Rebase rather than force anything: main may have moved while the
          # release was being verified, and this commit adds one line to one
          # file that nothing else writes.
          git pull --rebase origin main
          git push origin HEAD:main
