name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the canonical offline validation entrypoint
        id: validation
        run: >-
          python scripts/validate_all.py --offline
          --json-output "${{ runner.temp }}/cognitive-powers-validation.json"
      - name: Report validation receipt
        id: receipt-report
        if: always()
        run: >-
          python scripts/report_validation_receipt.py
          --receipt "${{ runner.temp }}/cognitive-powers-validation.json"
      - name: Preserve validation receipt
        id: receipt-upload
        if: always() && steps.receipt-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/cognitive-powers-validation.json
          if-no-files-found: error
      - name: Report validation and artifact publication status
        if: always()
        run: >-
          python scripts/report_validation_receipt.py
          --receipt "${{ runner.temp }}/cognitive-powers-validation.json"
          --publication-outcome "${{ steps.receipt-upload.outcome }}"
