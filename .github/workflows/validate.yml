name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python }}, Codex ${{ matrix.codex }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
        codex: ["0.145.0", "0.146.0-alpha.3.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install exact lockfile-backed Codex CLI
        run: npm ci --prefix "ci/codex-${{ matrix.codex }}" --ignore-scripts --no-audit --no-fund
      - name: Expose the lockfile-backed Codex executable
        run: >-
          python -c "import os; from pathlib import Path; p=(Path('ci')/'codex-${{ matrix.codex }}'/'node_modules'/'.bin').resolve(); Path(os.environ['GITHUB_PATH']).open('a',encoding='utf-8').write(str(p)+'\n')"
      - name: Install hash-locked validation dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install the Claude Code CLI for plugin validation
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code
      - name: Validate the Claude Code plugin surface
        # Unpinned on purpose: this asserts the packaging still satisfies the
        # current published schema. A failure here is real drift, not flake.
        # tests/test_claude_plugin_contract.py remains the deterministic gate.
        run: claude plugin validate . --strict
      - name: Exercise the cross-platform hook lock
        run: python -m unittest tests.test_plugin_hooks.PluginHookTests.test_short_lock_contention_does_not_silently_drop_event tests.test_plugin_hooks.PluginHookTests.test_unlocked_residual_lock_file_does_not_block_event
      - name: Run verify-installed-fixture in a disposable home
        run: python tests/fixtures/run_verify_installed_fixture.py
      - name: Run the canonical offline validation entrypoint
        id: validation
        run: >-
          python scripts/validate_all.py --offline
          --json-output "${{ runner.temp }}/cognitive-powers-validation.json"

      - name: Install and verify the exact tag in a disposable Codex home
        id: immutable-install
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $codexProfile = Join-Path "${{ runner.temp }}" "codex-profile"
          $env:CODEX_HOME = Join-Path $codexProfile ".codex"
          $env:HOME = $codexProfile
          $env:USERPROFILE = $codexProfile
          # Codex refuses to load a configuration when CODEX_HOME names a path
          # that does not exist, so a disposable home has to be materialized
          # rather than only named before the installer runs any codex command.
          New-Item -ItemType Directory -Force -Path $env:CODEX_HOME | Out-Null
          ./install.ps1 -ReleaseRef "${{ github.ref_name }}"
          $marketplaceState = codex plugin marketplace list --json | ConvertFrom-Json
          $entry = @($marketplaceState.marketplaces | Where-Object { $_.name -eq "cognitive-powers" })
          if ($entry.Count -ne 1) { throw "expected one cognitive-powers marketplace" }
          $report = & python scripts/verify_installed.py --source-root $entry[0].root --installed-root $entry[0].root --tag "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "canonical installed verifier failed" }
          [IO.File]::WriteAllText(
            (Join-Path "${{ runner.temp }}" "installation-verification.json"),
            (($report -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build release manifest (first pass)
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python scripts/build_release_manifest.py
          --tag "${{ github.ref_name }}"
          --archive "${{ runner.temp }}/release-one.tar"
          --output "${{ runner.temp }}/release-one.json"
      - name: Build release manifest (second pass)
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python scripts/build_release_manifest.py
          --tag "${{ github.ref_name }}"
          --archive "${{ runner.temp }}/release-two.tar"
          --output "${{ runner.temp }}/release-two.json"
      - name: compare-release-builds
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}"
          # Name what differed: a silent reproducibility failure was one of
          # the shapes that let nine tag-only defects mask each other.
          status=0
          for name in tar json; do
            if ! cmp "release-one.$name" "release-two.$name"; then
              echo "release-one.$name and release-two.$name differ between the two builds" >&2
              ls -l "release-one.$name" "release-two.$name" >&2
              status=1
            fi
          done
          exit "$status"
      - name: Write release archive checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python -c "from pathlib import Path; import hashlib; p=Path(r'${{ runner.temp }}'); a=p/'release-one.tar'; (p/'release-one.sha256').write_text(hashlib.sha256(a.read_bytes()).hexdigest()+'  release-one.tar\n', encoding='ascii', newline='\n')"
      - name: Verify exact version-tag release identity
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python scripts/release_witness.py
          --receipt "${{ runner.temp }}/cognitive-powers-validation.json"
          --release-manifest "${{ runner.temp }}/release-one.json"
          --output "${{ runner.temp }}/cognitive-powers-release-witness.json"
      - name: Report validation receipt
        id: receipt-report
        if: always()
        run: >-
          python scripts/report_validation_receipt.py
          --receipt "${{ runner.temp }}/cognitive-powers-validation.json"
      - name: Name receipt for matrix aggregation
        if: always() && steps.receipt-report.outcome == 'success'
        run: >-
          python -c "from pathlib import Path; import shutil; p=Path(r'${{ runner.temp }}'); shutil.copy2(p/'cognitive-powers-validation.json', p/'validation-${{ matrix.os }}-py${{ matrix.python }}-codex${{ matrix.codex }}.json')"
      - name: Resolve exact Codex CLI version
        id: codex-version
        if: always() && steps.receipt-report.outcome == 'success'
        # The lockfile-backed CLI is an npm shim, so on Windows it is codex.cmd.
        # CreateProcess only ever appends .exe to a bare name, which is why the
        # six Windows cells raised WinError 2 here; shutil.which honours PATHEXT
        # and resolves the shim the surrounding pwsh steps already run.
        run: >-
          python -c "import os,shutil,subprocess; from pathlib import Path; exe=shutil.which('codex'); assert exe, 'codex is not on PATH'; r=subprocess.run([exe,'--version'],capture_output=True,text=True,check=True); v=' '.join(r.stdout.split()); assert v; Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8').write('value='+v+'\n')"
      - name: Exercise real upgrade and rollback with the supported Codex host
        if: startsWith(github.ref, 'refs/tags/') && steps.immutable-install.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/run_real_upgrade_rollback.ps1
          -ReleaseRef "${{ github.ref_name }}"
          -OutputDirectory "${{ runner.temp }}/upgrade-rollback"
      - name: Bind deterministic scenario tests to real lifecycle evidence
        if: startsWith(github.ref, 'refs/tags/') && steps.immutable-install.outcome == 'success'
        run: >-
          python scripts/run_compatibility_scenarios.py
          --real-evidence "${{ runner.temp }}/upgrade-rollback/upgrade-rollback-evidence.json"
          --commit "${{ github.sha }}"
          --tag "${{ github.ref_name }}"
          --output "${{ runner.temp }}/compatibility-scenario-evidence.json"
      - name: Produce evidence-bound compatibility receipts
        if: startsWith(github.ref, 'refs/tags/') && steps.codex-version.outcome == 'success' && steps.immutable-install.outcome == 'success'
        shell: pwsh
        run: |
          $evidencePath = "${{ runner.temp }}/compatibility-scenario-evidence.json"
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $scenarios = @("clean-install")
          $scenarios += @($evidence.scenarios.PSObject.Properties | Where-Object { $_.Value.passed } | ForEach-Object { $_.Name })
          foreach ($scenario in $scenarios) {
            $arguments = @(
              "scripts/create_compatibility_receipt.py",
              "--validation", "${{ runner.temp }}/cognitive-powers-validation.json",
              "--installation", "${{ runner.temp }}/installation-verification.json",
              "--output", "${{ runner.temp }}/compatibility-${{ matrix.os }}-py${{ matrix.python }}-codex${{ matrix.codex }}-$scenario.json",
              "--os", "${{ matrix.os }}",
              "--python", "${{ matrix.python }}",
              "--codex-cli-version", "${{ steps.codex-version.outputs.value }}",
              "--scenario", $scenario,
              "--commit", "${{ github.sha }}",
              "--workflow", "validate.yml",
              "--run-id", "${{ github.run_id }}",
              "--run-attempt", "${{ github.run_attempt }}"
            )
            if ($scenario -ne "clean-install") {
              $arguments += @("--scenario-evidence", $evidencePath)
            }
            & python @arguments
            if ($LASTEXITCODE -ne 0) { throw "compatibility receipt failed: $scenario" }
          }
      - name: Preserve validation receipt
        id: receipt-upload
        if: always() && steps.receipt-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}-codex${{ matrix.codex }}
          path: |
            ${{ runner.temp }}/cognitive-powers-validation.json
            ${{ runner.temp }}/validation-${{ matrix.os }}-py${{ matrix.python }}-codex${{ matrix.codex }}.json
            ${{ runner.temp }}/compatibility-${{ matrix.os }}-py${{ matrix.python }}-codex${{ matrix.codex }}-*.json
            ${{ runner.temp }}/upgrade-rollback/upgrade-rollback-evidence.json
            ${{ runner.temp }}/compatibility-scenario-evidence.json
            ${{ runner.temp }}/upgrade-rollback/upgrade-installation-verification.json
            ${{ runner.temp }}/upgrade-rollback/rollback-installation-verification.json
            ${{ runner.temp }}/installation-verification.json
            ${{ runner.temp }}/cognitive-powers-release-witness.json
            ${{ runner.temp }}/release-one.tar
            ${{ runner.temp }}/release-one.json
            ${{ runner.temp }}/release-one.sha256
          if-no-files-found: error
      - name: Report validation and artifact publication status
        if: always()
        run: >-
          python scripts/report_validation_receipt.py
          --receipt "${{ runner.temp }}/cognitive-powers-validation.json"
          --publication-outcome "${{ steps.receipt-upload.outcome }}"

  aggregate-release-evidence:
    if: startsWith(github.ref, 'refs/tags/')
    needs: offline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validation-*
          path: ${{ runner.temp }}/matrix-evidence
          merge-multiple: false
      - name: Require all twelve validation receipts
        run: >-
          python -c "from pathlib import Path; import sys; p=Path(r'${{ runner.temp }}/matrix-evidence'); receipts=sorted(p.rglob('validation-*.json')); print(f'found {len(receipts)} validation receipts:'); [print(' ', r.name) for r in receipts]; sys.exit(0 if len(receipts)==12 else 1)"
      - name: Aggregate receipts from the twelve successful jobs in this workflow run
        shell: bash
        run: |
          set -euo pipefail
          # Each cell also uploads compatibility-scenario-evidence.json, which
          # matches this glob but is the input the receipts were derived from,
          # not a receipt. Counting it made the twelve cells look like 120.
          mapfile -t receipts < <(find "${{ runner.temp }}/matrix-evidence" -name 'compatibility-*.json' -type f ! -name 'compatibility-scenario-evidence.json' | sort)
          if [ "${#receipts[@]}" -ne 108 ]; then
            echo "expected 108 compatibility receipts, found ${#receipts[@]}:" >&2
            printf '  %s\n' "${receipts[@]:-<none>}" >&2
            exit 1
          fi
          mapfile -t verified < <(python - "${receipts[@]}" <<'PY'
          import json, os, sys
          seen = set()
          for name in sys.argv[1:]:
              receipt = json.load(open(name, encoding="utf-8"))
              identity = receipt.get("identity", {})
              installation = receipt.get("installation", {})
              assert identity.get("commit") == os.environ["GITHUB_SHA"], (
                  f"{name}: receipt commit {identity.get('commit')!r} is not this run's {os.environ['GITHUB_SHA']!r}")
              assert identity.get("runId") == os.environ["GITHUB_RUN_ID"], (
                  f"{name}: receipt runId {identity.get('runId')!r} is not this run's {os.environ['GITHUB_RUN_ID']!r}")
              assert identity.get("runAttempt") == int(os.environ["GITHUB_RUN_ATTEMPT"]), (
                  f"{name}: receipt runAttempt {identity.get('runAttempt')!r} is not attempt {os.environ['GITHUB_RUN_ATTEMPT']!r}")
              assert installation.get("commit") == os.environ["GITHUB_SHA"], (
                  f"{name}: installation commit {installation.get('commit')!r} is not this run's head")
              key = (receipt["os"], receipt["python"], receipt["codexCli"], receipt["scenario"])
              assert key not in seen, f"{name}: duplicate receipt for cell {key}"
              seen.add(key)
              print(receipt["receiptSha256"])
          cells = {(os_name, python, codex) for os_name, python, codex, _scenario in seen}
          assert len(cells) == 12, f"expected 12 matrix cells, receipts describe {len(cells)}: {sorted(cells)}"
          for cell in cells:
              scenarios = {scenario for os_name, python, codex, scenario in seen if (os_name, python, codex) == cell}
              missing = {"clean-install", "upgrade-v1.5.2", "rollback"} - scenarios
              assert not missing, f"cell {cell} is missing lifecycle scenarios: {sorted(missing)}"
          PY
          )
          args=()
          for digest in "${verified[@]}"; do args+=(--verified-receipt-sha256 "$digest"); done
          python scripts/build_compatibility_matrix.py --contract compatibility-contract.json --receipts "${receipts[@]}" "${args[@]}" --json-output "${{ runner.temp }}/compatibility-matrix.json" --markdown-output "${{ runner.temp }}/compatibility.md"
          python - "${{ runner.temp }}/compatibility-matrix.json" <<'PY'
          import json, sys
          matrix=json.load(open(sys.argv[1], encoding='utf-8'))
          rows=len(matrix['rows'])
          assert rows == 108, f"matrix carries {rows} rows, expected 108"
          distinct=len({(r['os'],r['python'],r['codexCli'],r['scenario']) for r in matrix['rows']})
          assert distinct == 108, f"matrix rows collapse to {distinct} distinct cells"
          summary=matrix['summary']
          assert summary == {'compatible': 108, 'incompatible': 0, 'unknown': 0}, f"matrix summary is {summary}"
          PY
          python scripts/validate_compatibility_matrix.py --matrix "${{ runner.temp }}/compatibility-matrix.json" --contract compatibility-contract.json
      - name: Verify all twelve release builds and select canonical bytes
        run: >-
          python scripts/aggregate_release_artifacts.py
          --source "${{ runner.temp }}/matrix-evidence"
          --output "${{ runner.temp }}/release-final"
          --expected-cells 12
      - name: Resolve the canonical archive name from the aggregated evidence
        id: release-identity
        run: >-
          python -c "import json,os;from pathlib import Path;report=json.loads(Path(r'${{ runner.temp }}/release-final/reproducibility-report.json').read_text(encoding='utf-8'));Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8').write('archive='+report['archive']+'\n')"
      - name: Build aggregated release witness
        run: >-
          python -c "from pathlib import Path; import subprocess,sys; p=Path(r'${{ runner.temp }}/matrix-evidence'); receipts=sorted(p.rglob('validation-*.json')); manifest=Path(r'${{ runner.temp }}/release-final/release-manifest.json'); raise SystemExit(subprocess.call([sys.executable,'scripts/release_witness.py',*sum((['--receipt',str(r)] for r in receipts),[]),'--release-manifest',str(manifest),'--output',r'${{ runner.temp }}/cognitive-powers-release-witness.json']))"
      - name: Verify preserved archive checksum after download
        shell: bash
        working-directory: ${{ runner.temp }}/release-final
        env:
          ARCHIVE: ${{ steps.release-identity.outputs.archive }}
        run: sha256sum --check "$ARCHIVE.sha256"
      - name: Attest canonical release archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/release-final/${{ steps.release-identity.outputs.archive }}
      - name: Gather the publishable asset set into one directory
        # upload-artifact keeps each path relative to the least common ancestor
        # of every path given. Mixing runner.temp with runner.temp/release-final
        # therefore produced an artifact holding three files and a release-final
        # directory, while the publisher lists assets with a depth of one and
        # attaches them with a flat glob. Staging them together keeps the
        # artifact flat and the asset allowlist exact.
        run: >-
          python -c "import shutil; from pathlib import Path; t=Path(r'${{ runner.temp }}'); d=t/'release-final'; [shutil.copy2(t/n, d/n) for n in ('cognitive-powers-release-witness.json','compatibility-matrix.json','compatibility.md')]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Constant name: artifacts are already scoped to one run, the
          # publisher binds run and tag explicitly, and branch refs contain
          # "/", which is invalid in artifact names -- the ref-suffixed name
          # is what kept every branch run from producing release evidence.
          name: release-evidence
          path: |
            ${{ runner.temp }}/release-final/${{ steps.release-identity.outputs.archive }}
            ${{ runner.temp }}/release-final/${{ steps.release-identity.outputs.archive }}.sha256
            ${{ runner.temp }}/release-final/release-manifest.json
            ${{ runner.temp }}/release-final/reproducibility-report.json
            ${{ runner.temp }}/release-final/cognitive-powers-release-witness.json
            ${{ runner.temp }}/release-final/compatibility-matrix.json
            ${{ runner.temp }}/release-final/compatibility.md
          if-no-files-found: error
