name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the canonical offline validation entrypoint
        id: validation
        run: >-
          python scripts/validate_all.py --offline
          --json-output "${{ runner.temp }}/cognitive-powers-validation.json"
      - name: Preserve validation receipt
        id: receipt-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/cognitive-powers-validation.json
          if-no-files-found: error
      - name: Report validation and publication status
        if: always()
        shell: python
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          ARTIFACT_PUBLICATION_OUTCOME: ${{ steps.receipt-upload.outcome }}
        run: |
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("## Offline validation result\n\n")
              stream.write(
                  f"- Validation: `{os.environ['VALIDATION_OUTCOME']}`\n"
              )
              stream.write(
                  "- Artifact publication: "
                  f"`{os.environ['ARTIFACT_PUBLICATION_OUTCOME']}`\n"
              )
