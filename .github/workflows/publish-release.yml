name: Publish validated release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable release tag
        required: true
        type: string
      run_id:
        description: Successful validation workflow run ID for this tag
        required: true
        type: string

permissions:
  contents: write
  actions: read
  attestations: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Bind validation run, tag, and checked-out commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # The release this workflow may publish is the one the tagged manifest
          # declares, not a literal that has to be remembered at every bump.
          declared=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('.codex-plugin/plugin.json').read_text(encoding='utf-8'))['version'].split('+',1)[0])")
          test "$TAG" = "v$declared"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          tag_commit=$(git rev-parse "${TAG}^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_commit"
          test "$(git tag --points-at HEAD)" = "$TAG"
          read -r conclusion event head_sha head_branch < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '[.conclusion,.event,.head_sha,.head_branch] | @tsv'
          )
          test "$conclusion" = "success"
          test "$event" = "push"
          test "$head_sha" = "$tag_commit"
          test "$head_branch" = "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists; refusing replacement" >&2
            exit 1
          fi
      - name: Download exact validated release evidence
        # Not into ./assets: that directory is part of the checkout and holds
        # the plugin's icons and logos. Downloading there mixed them with the
        # evidence, and the exact allowlist below is the only thing that kept
        # the repository's artwork from being attached to the release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${{ inputs.run_id }}"
          --name "release-evidence-${{ inputs.tag }}"
          --dir "${{ runner.temp }}/release-assets"
      - name: Verify asset allowlist, identity, checksum, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSETS: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          # Already bound to the tagged manifest by the preceding step.
          archive="cognitive-powers-${TAG#v}.tar"
          mapfile -t actual < <(find "$ASSETS" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            "$archive"
            "$archive.sha256"
            cognitive-powers-release-witness.json
            compatibility-matrix.json
            compatibility.md
            release-manifest.json
            reproducibility-report.json
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          # A bare test here refuses the release without saying what it found,
          # which is indistinguishable from every other silent failure in this
          # step. The allowlist stays exact; only the diagnosis is added.
          if [ "${actual[*]}" != "${expected[*]}" ]; then
            echo "downloaded asset set does not match the allowlist" >&2
            printf 'actual:   %s\n' "${actual[@]:-<none>}" >&2
            printf 'expected: %s\n' "${expected[@]}" >&2
            echo "--- tree under the download directory ---" >&2
            find "$ASSETS" -maxdepth 3 >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          python - "$TAG" "$commit" "$archive" "$ASSETS" <<'PY'
          import json, pathlib, sys
          assets=pathlib.Path(sys.argv[4])
          manifest=json.loads((assets / 'release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['tag'] == sys.argv[1]
          assert manifest['commit'] == sys.argv[2]
          assert manifest['version'] == sys.argv[1][1:]
          assert manifest['archive']['sha256'] == (assets / (sys.argv[3] + '.sha256')).read_text(encoding='ascii').split()[0]
          report=json.loads((assets / 'reproducibility-report.json').read_text(encoding='utf-8'))
          assert report['version'] == manifest['version']
          assert report['archive'] == sys.argv[3]
          matrix=json.loads((assets / 'compatibility-matrix.json').read_text(encoding='utf-8'))
          assert len(matrix['rows']) == 108
          assert matrix['summary'] == {'compatible': 108, 'incompatible': 0, 'unknown': 0}
          PY
          python scripts/validate_compatibility_matrix.py --matrix "$ASSETS/compatibility-matrix.json" --contract compatibility-contract.json
          (cd "$ASSETS" && sha256sum --check -- "./$archive.sha256")
          gh attestation verify "$ASSETS/$archive" --repo "$GITHUB_REPOSITORY"
      - name: Take the release notes from the changelog
        # The changelog is where this release is already explained. Generated
        # notes restate commit subjects instead, naming each change without its
        # cause or its blast radius, which is the part a reader deciding whether
        # to upgrade needs. Deriving them also fails the publish when the
        # changelog has no section for the tag being published.
        run: >-
          python scripts/release_identity.py
          --output "${{ runner.temp }}/release-notes.md"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ inputs.tag }}" "${{ runner.temp }}/release-assets"/*
          --verify-tag
          --title "Cognitive Powers ${{ inputs.tag }}"
          --notes-file "${{ runner.temp }}/release-notes.md"
