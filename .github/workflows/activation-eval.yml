name: Activation eval

# Measures whether the workflows actually fire on requests phrased the way
# requests arrive. Two jobs, split by what they cost.
#
# `corpus` is free and always runs: it loads and validates every case, checks
# that no workflow has fewer than three should-fire prompts, and runs the unit
# tests for the judgement path. A corpus defect should be caught before any
# provider is paid, not after ninety runs.
#
# `measure` spawns the real CLI and costs money, so it is gated on a secret
# being present and narrowed to the quick suite on pull requests. The full
# matrix is dispatch-only, because three arms over the whole corpus is roughly
# a thousand invocations and nothing about a pull request justifies that.
#
# A fork PR has no secret and skips `measure` rather than failing. Failing
# there would report a missing entitlement as a regression in the plugin.
#
# Three things bound what a run may spend, because "gated on a secret" bounds
# who may start one and nothing about how much it costs once started. The
# credential belongs to the `activation-eval` environment rather than to the
# repository, so a paid run waits for a reviewer instead of beginning; the
# plan is priced against a declared ceiling before the host is installed, so
# a mistyped `reps` is refused rather than billed; and the per-invocation
# budget is passed explicitly, so the number a session may spend moves in a
# diff instead of being inherited from a script default.

on:
  pull_request:
    paths:
      - "skills/**"
      - "skills-core/**"
      - "hooks/**"
      - "evals/**"
      - ".github/workflows/activation-eval.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: Corpus to run
        type: choice
        options: [quick, full]
        default: quick
      arms:
        description: Space-separated arms (none, instruction, full)
        type: string
        default: "none instruction full"
      reps:
        description: Repetitions per case
        type: string
        default: "3"
      floor:
        description: Minimum should-fire activation rate per arm
        type: string
        default: "0.75"

permissions:
  contents: read

# One paid measurement per ref at a time. Every push to a pull request that
# touches a skill starts another full quick suite, and without this the runs
# stack: a branch pushed five times in a morning pays five times over for a
# number that only the last push is about. Superseding is safe here because
# the measurement is of the ref, not of any single commit on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A single run of a non-deterministic decision is a coin flip. Both numbers
  # are inputs rather than constants so a regression threshold can be moved
  # deliberately, in a diff, rather than by editing a script.
  #
  # Both were declared defaults until 2026-08-03, when the first baseline gave
  # them something to be measured against -- see
  # docs/analysis/activation-baseline-v1.md.
  #
  # The floor moves 0.70 -> 0.75. The shipped arm activated on 57 of 62
  # complete should-fire runs over the whole corpus, 95% interval [0.825,
  # 0.965]. What this job actually gates is the quick suite, and that cohort
  # was 15 of 15 here, interval [0.796, 1.000]. 0.75 clears the lower bound of
  # both; 0.80 would sit above the quick cohort's and fail a healthy
  # configuration on sampling noise.
  DEFAULT_FLOOR: "0.75"
  # The ceiling stays 0.15, deliberately and not for want of a number. The
  # shipped arm drew one false positive in 19 complete should-not-fire runs,
  # 0.053, but 19 runs put the 95% upper bound at 0.246 -- so 0.15 is already
  # tighter than the measurement can defend and there is nothing to tighten it
  # with. On the quick suite's 8 negative cases at three repetitions it trips
  # on the fourth false positive out of 24, which is roughly a 4% chance of
  # failing a healthy configuration and the price of catching a real one.
  DEFAULT_MAX_FALSE_POSITIVE: "0.15"
  # Per invocation, handed to the host as --max-budget-usd. The runner already
  # defaults to this, and that is the problem: a ceiling nobody states is a
  # ceiling nobody notices moving. Stated here, the spend a session is allowed
  # is reviewable in the same diff as the run that spends it.
  MAX_COST_USD: "0.75"
  # Ceilings on the plan rather than on the bill, because the plan is knowable
  # for free and the bill is not. Both are worst cases: invocations times
  # MAX_COST_USD. The pull-request number is the tighter one because that path
  # runs unattended and its size is set by the corpus rather than by a person
  # -- 87 invocations today, so the headroom absorbs a few new quick cases and
  # then asks for a deliberate edit instead of quietly costing more.
  MAX_INVOCATIONS_PR: "120"
  MAX_INVOCATIONS_DISPATCH: "1000"

jobs:
  corpus:
    name: Corpus and judgement path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Validate the corpus without spawning anything
        run: python evals/run_activation_eval.py --validate-only --full
      - name: Test the judgement path
        run: >-
          python -m unittest
          tests.test_activation_eval_corpus
          tests.test_activation_eval_runner
          tests.test_skill_activation
          -v

  measure:
    name: Activation (${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'quick' }})
    needs: corpus
    runs-on: ubuntu-latest
    # The only job that can spend money, so the credential is scoped to it
    # rather than to the repository. An ANTHROPIC_API_KEY held as a repository
    # secret is readable by every workflow that later gains a step, and it
    # starts billing the moment a run reaches this job. Held as an environment
    # secret on `activation-eval` with required reviewers, neither is true: no
    # other workflow can resolve it, and this job waits for a person before it
    # installs the host. Configure the environment before adding the secret --
    # an environment without reviewers is only a label.
    environment: activation-eval
    timeout-minutes: 180
    steps:
      - name: Report whether a provider credential is available
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANTHROPIC_API_KEY; the paid activation run is skipped."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.credential.outputs.available == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.credential.outputs.available == 'true'
        with:
          python-version: "3.13"
      # Before the host is installed, not after: the plan is knowable without
      # spawning anything, so a run that would exceed the ceiling should cost
      # nothing to refuse. The count comes from the runner's own --validate-only
      # rather than being re-derived here, because a second implementation of
      # "how many invocations is this" would eventually disagree with the one
      # that actually spends the money -- and it is the disagreeing case that
      # would go unnoticed.
      - name: Price the plan and refuse to exceed the declared ceiling
        if: steps.credential.outputs.available == 'true'
        env:
          SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'quick' }}
          ARMS: ${{ github.event_name == 'workflow_dispatch' && inputs.arms || 'full' }}
          REPS: ${{ github.event_name == 'workflow_dispatch' && inputs.reps || '3' }}
        shell: bash
        run: |
          set -euo pipefail
          # `reps` is a free-text box on the dispatch form: 30 is one keystroke
          # from 3 and multiplies every arm by every case by ten. argparse would
          # take it and the provider would bill it, so it is checked as a small
          # positive integer here rather than trusted.
          if ! [[ "$REPS" =~ ^[1-9][0-9]?$ ]]; then
            echo "reps must be an integer between 1 and 99; got '$REPS'" >&2
            exit 1
          fi
          arm_flags=""
          for arm in $ARMS; do arm_flags="$arm_flags --arm $arm"; done
          plan=$(python evals/run_activation_eval.py \
            --validate-only $arm_flags --reps "$REPS" --"$SUITE")
          echo "$plan"
          invocations=$(printf '%s\n' "$plan" |
            sed -n 's/.*-> \([0-9][0-9]*\) host invocations.*/\1/p')
          if [ -z "$invocations" ]; then
            echo "could not read an invocation count from the plan" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ceiling="$MAX_INVOCATIONS_DISPATCH"
          else
            ceiling="$MAX_INVOCATIONS_PR"
          fi
          worst=$(python -c "import sys;print(f'{int(sys.argv[1])*float(sys.argv[2]):.2f}')" \
            "$invocations" "$MAX_COST_USD")
          echo "::notice::$invocations invocations, at most \$$worst at \$$MAX_COST_USD each (ceiling $ceiling)."
          if [ "$invocations" -gt "$ceiling" ]; then
            echo "plan of $invocations invocations exceeds the ceiling of $ceiling" >&2
            echo "raise MAX_INVOCATIONS_* deliberately, or narrow the suite, arms or reps" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.credential.outputs.available == 'true'
        with:
          node-version: "24"

      - name: Install the Claude Code CLI
        if: steps.credential.outputs.available == 'true'
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code

      - name: Run the activation eval
        if: steps.credential.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'quick' }}
          ARMS: ${{ github.event_name == 'workflow_dispatch' && inputs.arms || 'instruction' }}
          REPS: ${{ github.event_name == 'workflow_dispatch' && inputs.reps || '3' }}
          FLOOR: ${{ github.event_name == 'workflow_dispatch' && inputs.floor || '' }}
        run: |
          set -euo pipefail
          arm_flags=""
          for arm in $ARMS; do arm_flags="$arm_flags --arm $arm"; done
          python evals/run_activation_eval.py \
            $arm_flags \
            --reps "$REPS" \
            --"$SUITE" \
            --python-executable "$(command -v python)" \
            --json-output activation.json \
            --markdown-output activation.md \
            --max-cost-usd "$MAX_COST_USD" \
            --floor "${FLOOR:-$DEFAULT_FLOOR}" \
            --max-false-positive "$DEFAULT_MAX_FALSE_POSITIVE"

      - name: Publish the report to the job summary
        if: always() && steps.credential.outputs.available == 'true'
        run: |
          if [ -f activation.md ]; then
            cat activation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The run produced no report." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kept whatever the outcome. A failed threshold is exactly the run whose
      # per-case detail someone needs, and re-running it to get the artifact
      # would pay for the measurement twice.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.credential.outputs.available == 'true'
        with:
          name: activation-${{ github.run_id }}
          path: |
            activation.json
            activation.md
          retention-days: 30
          if-no-files-found: warn
